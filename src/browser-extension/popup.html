<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body { font-family: system-ui, sans-serif; width: 280px; margin: 0; padding: 12px; color: #1e1e1e; background: #fff; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .row { margin: 6px 0; font-size: 12px; }
    label { display: block; font-size: 11px; color: #555; margin-bottom: 2px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; font-size: 12px; border: 1px solid #aaa; border-radius: 4px; }
    .status { font-size: 12px; min-height: 32px; margin-bottom: 8px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot.green { background: #2e7d32; }
    .dot.red { background: #c62828; }
    .dot.amber { background: #a66900; }
    button { margin-top: 8px; min-width: 84px; padding: 6px 10px; font-size: 12px; border: 1px solid #1565c0; border-radius: 4px; background: #1565c0; color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    input:focus-visible, button:focus-visible { outline: 2px solid #1565c0; outline-offset: 2px; }
    .hint { font-size: 11px; color: #555; line-height: 1.5; margin-top: 8px; min-height: 50px; }
  </style>
</head>
<body>
  <h1>BS Coding Browser</h1>
  <div class="status" role="status" aria-live="polite"><span id="dot" class="dot amber" aria-hidden="true"></span><span id="statusText">Connecting…</span></div>
  <div class="row"><label for="label">Connection label</label><input id="label" maxlength="100" value="Chrome" placeholder="Chrome Work" /></div>
  <button id="connectBtn">Connect</button>
  <div class="hint" id="hint">Use a label to identify this Chrome profile in BS Coding.</div>
  <script src="popup.js"></script>
</body>
</html>
